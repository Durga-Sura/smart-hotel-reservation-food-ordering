spring.application.name=table-thyme
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/table_thyme?createDatabaseIfNotExist=true&connectionTimeZone=Asia/Kolkata}
spring.datasource.username=${DB_USER:tablethyme}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${COOKIE_SECURE:false}
server.servlet.session.timeout=30m
server.error.include-message=never
spring.jackson.serialization.write-dates-as-timestamps=false
app.zone=${HOTEL_ZONE:Asia/Kolkata}
app.owner.email=${OWNER_EMAIL:}
app.owner.password=${OWNER_PASSWORD:}
